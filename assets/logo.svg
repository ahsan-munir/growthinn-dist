<!--
  logo.svg — THE STANDALONE MARK. Not used by the site.

  The header renders components/patterns/Logo.astro INLINE, because the
  wordmark has to invert with the header (light over the dark stage, ink on
  paper) and an <img> is opaque to CSS. THAT FILE IS THE SOURCE OF TRUTH.

  This copy exists for anything outside the page: an email signature, a
  profile avatar, a deck. It is kept in sync by hand, and on 2026-09-12 it
  was NOT: the mark was recoloured green to blue on 2026-09-10 and this
  file still carried the green ramp. It shipped to dist/ unreferenced, so
  nothing on the site was wrong — but anyone who opened it got the old mark.

  DIFFERENCE FROM Logo.astro, deliberate: the wordmark here is a literal
  #F6F7F5 (near-white, for a dark ground) rather than currentColor, because
  a standalone file has no parent to inherit from. On a light ground the
  lettering will be invisible — use Logo.astro, or recolour that one path.

  If the ramp changes again, change BOTH. There is no build step linking them.
-->
